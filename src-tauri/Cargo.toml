[package]
name = "timetracking"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "timetracking_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40.2", features = ["bundled", "chrono"] }
rusqlite_migration = "2.6.0"
reqwest = { version = "0.13.4", features = ["json"] }
async-trait = "0.1.92"
keyring = { version = "4.1.6", features = ["apple-native-keyring-store"] }
chrono = { version = "0.4.45", features = ["serde"] }
thiserror = "2.0.20"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
base64 = "0.23.1"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros"] }
tauri-plugin-dialog = "2.7.2"

[dev-dependencies]
wiremock = "0.6.5"

